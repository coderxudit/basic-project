<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            color: #222;
        }

        nav {
            background: #222;
            color: white;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #00adb5;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .hero span {
            color: #00adb5;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            border: none;
            background: #00adb5;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #008b91;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>MyWebsite</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <div>
            <h1>Hello, I'm <span>Ridit</span></h1>

            <p>
                Welcome to my first deployed website 🚀
            </p>

            <button onclick="showMessage()">
                Click Me
            </button>

            <p id="message"></p>
        </div>
    </section>

    <footer>
        © 2026 MyWebsite | All Rights Reserved
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "Website is working successfully! 🎉";
        }
    </script>

</body>
</html>
